[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aktien-chatbot"
version = "0.1.0"
description = "KI-gestützter Aktien-Chatbot mit Alpaca-Paper-Trading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py",
    "openai",
    "pandas",
    "python-dotenv",
    "streamlit",
    "yfinance",
]

[tool.setuptools]
py-modules = ["validation"]

[tool.setuptools.packages.find]
include = ["data"]
